    <script>
      (function() {
        // Defensive fix for browser extensions and userscripts (e.g. Video-Downloader-Universal, Tampermonkey)
        // that attempt to monkey-patch window.fetch when it has only a getter in certain sandbox/iframe contexts
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var _fetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(val) {
              _fetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Suppress uncaught errors injected by third-party browser extensions or userscripts
        window.addEventListener('error', function(event) {
          var filename = (event && event.filename) ? event.filename : '';
          var message = (event && event.message) ? event.message : '';
          if (
            filename.indexOf('chrome-extension:') !== -1 ||
            filename.indexOf('moz-extension:') !== -1 ||
            filename.indexOf('userscript') !== -1 ||
            message.indexOf('Cannot set property fetch') !== -1
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason && reason.message ? reason.message : (typeof reason === 'string' ? reason : '');
          if (msg && msg.indexOf('Cannot set property fetch') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // Theme initialization
        try {
          var theme = localStorage.getItem('rubby_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
